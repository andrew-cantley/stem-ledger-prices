name: Update flower prices

on:
  schedule:
    - cron: "23 21 1 * *"   # the 1st of every month, 2:23 pm Mountain (standard time)
  workflow_dispatch: {}      # also lets you run it by hand from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Read current prices
        run: python3 update_prices.py
      - name: Save the price file
        run: |
          git config user.name "price-bot"
          git config user.email "price-bot@users.noreply.github.com"
          git add prices.json
          git diff --cached --quiet || git commit -m "Monthly price update"
          git push
