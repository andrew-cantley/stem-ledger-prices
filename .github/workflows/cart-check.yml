name: Cart link check
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for u in "https://fiftyflowers.com/cart/37679644541090:1,39854162215074:1?storefront=true" "https://flowermoxie.com/cart/43745766572120:1,43133820010584:1?storefront=true" "https://flowerexplosion.com/cart/39841325744215:1,39842089599063:1?storefront=true" "https://bloomingmore.com/cart/40327358283858:1,41143419404370:1?storefront=true"; do
            echo "== $u"
            curl -s -o /tmp/body.html -D /tmp/h1.txt -c /tmp/jar.txt -A "Mozilla/5.0 (StemLedger cart link check)" "$u"
            head -1 /tmp/h1.txt; grep -i "^location:" /tmp/h1.txt | cut -c1-200
            host=$(echo "$u" | cut -d/ -f1-3)
            curl -s -b /tmp/jar.txt -A "Mozilla/5.0 (StemLedger cart link check)" "$host/cart.js" | python3 -c "import sys,json; d=json.load(sys.stdin); print('cart items:', d.get('item_count'), [ (i.get('title','')[:40], i.get('quantity')) for i in d.get('items',[])])" || echo "cart.js not readable"
          done
